openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: suppliers
    description: Supplier records and directory analytics
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /purchase-entry/email:
    post:
      operationId: sendPurchasePriceEmail
      tags: [suppliers]
      summary: Email a reviewed purchase price
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchasePriceEmailInput"
      responses:
        "200":
          description: Purchase price email sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchasePriceEmailResult"
        "400":
          description: Invalid purchase price details
        "404":
          description: Supplier not found
        "429":
          description: Email send rate limit reached
        "502":
          description: Email delivery failed or is uncertain
  /purchase-entry:
    get:
      operationId: listPurchaseEntries
      tags: [suppliers]
      summary: List recent emailed purchase entries
      responses:
        "200":
          description: Recent purchase entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PurchaseEntryHistoryItem"
  /purchase-entry/{purchaseEntryId}/status:
    get:
      operationId: getPurchaseEntryStatus
      tags: [suppliers]
      summary: Check a purchase entry approval reply
      parameters:
        - name: purchaseEntryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current purchase entry status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseEntryStatus"
        "404":
          description: Purchase entry not found
        "502":
          description: Gmail reply status could not be checked
  /suppliers:
    get:
      operationId: listSuppliers
      tags: [suppliers]
      summary: List suppliers
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: city
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: paymentTerms
          in: query
          required: false
          schema:
            type: string
        - name: sortBy
          in: query
          required: false
          schema:
            type: string
            enum: [supplierName, city, supplierId]
        - name: sortOrder
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
      responses:
        "200":
          description: Matching supplier records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Supplier"
    post:
      operationId: createSupplier
      tags: [suppliers]
      summary: Create a supplier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplierInput"
      responses:
        "201":
          description: Supplier created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Supplier"
  /suppliers/summary:
    get:
      operationId: getSupplierSummary
      tags: [suppliers]
      summary: Get supplier directory summary
      responses:
        "200":
          description: Directory totals and breakdowns
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupplierSummary"
  /suppliers/{supplierId}:
    get:
      operationId: getSupplier
      tags: [suppliers]
      summary: Get a supplier
      parameters:
        - name: supplierId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Supplier record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Supplier"
        "404":
          description: Supplier not found
    patch:
      operationId: updateSupplier
      tags: [suppliers]
      summary: Update a supplier
      parameters:
        - name: supplierId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplierUpdate"
      responses:
        "200":
          description: Supplier updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Supplier"
        "404":
          description: Supplier not found
    delete:
      operationId: deleteSupplier
      tags: [suppliers]
      summary: Delete a supplier
      parameters:
        - name: supplierId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Supplier deleted
        "404":
          description: Supplier not found
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Supplier:
      type: object
      properties:
        supplierId:
          type: string
        supplierName:
          type: string
        address:
          type: string
        city:
          type: string
        state:
          type: string
        zipCode:
          type: string
        country:
          type: string
        contact:
          type: string
          format: email
        paymentTerms:
          type: string
      required:
        - supplierId
        - supplierName
        - address
        - city
        - state
        - zipCode
        - country
        - contact
        - paymentTerms
    SupplierInput:
      type: object
      properties:
        supplierId:
          type: string
          minLength: 1
        supplierName:
          type: string
          minLength: 1
        address:
          type: string
          minLength: 1
        city:
          type: string
          minLength: 1
        state:
          type: string
          minLength: 1
        zipCode:
          type: string
          minLength: 1
        country:
          type: string
          minLength: 1
        contact:
          type: string
          format: email
          minLength: 1
        paymentTerms:
          type: string
          minLength: 1
      required:
        - supplierId
        - supplierName
        - address
        - city
        - state
        - zipCode
        - country
        - contact
        - paymentTerms
    SupplierUpdate:
      type: object
      properties:
        supplierName:
          type: string
          minLength: 1
        address:
          type: string
          minLength: 1
        city:
          type: string
          minLength: 1
        state:
          type: string
          minLength: 1
        zipCode:
          type: string
          minLength: 1
        country:
          type: string
          minLength: 1
        contact:
          type: string
          format: email
          minLength: 1
        paymentTerms:
          type: string
          minLength: 1
      required:
        - supplierName
        - address
        - city
        - state
        - zipCode
        - country
        - contact
        - paymentTerms
    SupplierBreakdown:
      type: object
      properties:
        label:
          type: string
        count:
          type: integer
      required: [label, count]
    SupplierSummary:
      type: object
      properties:
        totalSuppliers:
          type: integer
        cityCount:
          type: integer
        countryCount:
          type: integer
        paymentTerms:
          type: array
          items:
            $ref: "#/components/schemas/SupplierBreakdown"
        topCities:
          type: array
          items:
            $ref: "#/components/schemas/SupplierBreakdown"
      required:
        - totalSuppliers
        - cityCount
        - countryCount
        - paymentTerms
        - topCities
    PurchasePriceEmailInput:
      type: object
      additionalProperties: false
      properties:
        supplierId:
          type: string
          minLength: 1
          maxLength: 80
        itemName:
          type: string
          minLength: 1
          maxLength: 120
        price:
          type: string
          pattern: '^\d+(\.\d{1,2})?$'
      required:
        - supplierId
        - itemName
        - price
    PurchasePriceEmailResult:
      type: object
      properties:
        sent:
          type: boolean
        recipient:
          type: string
        orderNumber:
          type: string
        purchaseEntryId:
          type: string
          format: uuid
      required:
        - sent
        - recipient
        - orderNumber
        - purchaseEntryId
    PurchaseEntryStatus:
      type: object
      properties:
        status:
          type: string
          enum: [Sent, Approved]
        orderNumber:
          type: ["string", "null"]
      required: [status, orderNumber]
    PurchaseEntryHistoryItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        supplierId:
          type: string
        supplierName:
          type: string
        itemName:
          type: string
        price:
          type: string
        orderNumber:
          type: ["string", "null"]
        recipient:
          type: string
          format: email
        status:
          type: string
          enum: [Sent, Approved]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - supplierId
        - supplierName
        - itemName
        - price
        - orderNumber
        - recipient
        - status
        - createdAt

